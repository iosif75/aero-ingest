name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Same-repo PRs are already covered by the push run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aero
          POSTGRES_PASSWORD: aero
          POSTGRES_DB: aero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aero -d aero"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://aero:aero@localhost:5432/aero
        run: cargo test --locked

  docker:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aero-ingest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # No credentials: the daemon must refuse to start with exit code 2.
          set +e
          docker run --rm aero-ingest:ci
          code=$?
          set -e
          test "$code" -eq 2
          # The health probe must fail cleanly when nothing is listening.
          ! docker run --rm aero-ingest:ci healthcheck
