services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: aero
      POSTGRES_DB: aero
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aero-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The daemon itself. Opt-in so `docker compose up -d` still starts only
  # Postgres for local development: run `docker compose --profile daemon up -d`.
  aero-ingest:
    profiles: ["daemon"]
    build: .
    image: aero-ingest:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aero:aero@db:5432/aero
      OPENSKY_CREDENTIALS_FILE: /run/secrets/opensky_credentials
      AERO_RETENTION_DAYS: ${AERO_RETENTION_DAYS:-30}
      AERO_POLL_INTERVAL_SECS: ${AERO_POLL_INTERVAL_SECS:-60}
      RUST_LOG: ${RUST_LOG:-aero_ingest=info}
    secrets:
      - opensky_credentials
    ports:
      - "127.0.0.1:9090:9090"

secrets:
  opensky_credentials:
    # Host path to credentials.json, read from OPENSKY_CREDENTIALS_FILE in .env.
    file: ${OPENSKY_CREDENTIALS_FILE:-./credentials.json}

volumes:
  aero-pg:
