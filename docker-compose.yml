services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: aero
      POSTGRES_DB: aero
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aero-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The daemon itself. Opt-in so `docker compose up -d` still starts only
  # Postgres for local development: run `docker compose --profile daemon up -d`.
  aero-ingest:
    profiles: ["daemon"]
    build: .
    image: aero-ingest:latest
    restart: unless-stopped
    # Compose mounts file secrets with the host file's owner and mode, so on
    # Linux a chmod 600 credentials.json is only readable by its owner. Set
    # AERO_UID/AERO_GID in .env to that owner (`id -u`, `id -g`) in that case.
    user: "${AERO_UID:-10001}:${AERO_GID:-10001}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aero:aero@db:5432/aero
      OPENSKY_CREDENTIALS_FILE: /run/secrets/opensky_credentials
      AERO_RETENTION_DAYS: ${AERO_RETENTION_DAYS:-30}
      AERO_POLL_INTERVAL_SECS: ${AERO_POLL_INTERVAL_SECS:-60}
      RUST_LOG: ${RUST_LOG:-aero_ingest=info}
    secrets:
      - opensky_credentials
    ports:
      - "127.0.0.1:9090:9090"

  # Prometheus and Grafana for the daemon's /metrics. Opt-in as well:
  # `docker compose --profile daemon --profile monitoring up -d`.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aero-prometheus:/prometheus
    ports:
      # 9090 on the host is already the daemon's.
      - "127.0.0.1:9091:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - db
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only access without logging in. The port is bound to localhost.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aero-ingest.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aero-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

secrets:
  opensky_credentials:
    # Host path to credentials.json, read from OPENSKY_CREDENTIALS_FILE in .env.
    file: ${OPENSKY_CREDENTIALS_FILE:-./credentials.json}

volumes:
  aero-pg:
  aero-prometheus:
  aero-grafana:
